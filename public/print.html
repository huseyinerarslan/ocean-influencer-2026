<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.screenbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#12253a;color:#fff;box-shadow:0 2px 12px #0002}.screenbar b{margin-right:auto}.screenbar button{font:inherit;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#fff;color:#12253a}.screenbar button.primary{background:#2d79b8;color:#fff}.notice{max-width:920px;margin:16px auto 0;padding:12px 16px;border-radius:10px;background:#fff4cc;color:#6b5700;display:none}.preview{padding:18px}.sheet{background:#fff;margin:0 auto 18px;box-shadow:0 7px 28px #17203324;position:relative;overflow:hidden;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.order-sheet{width:148mm;min-height:210mm;padding:8mm 7mm}.print-logo{display:block;width:43mm;height:auto;object-fit:contain}.order-logo{margin-bottom:5mm}.company{font-size:6.8pt;line-height:1.35;margin-top:3mm;color:#343a40}.delivery{margin:7mm 0 3mm;padding:2.2mm 0;border-top:.35mm solid #111;border-bottom:.35mm solid #111;font-size:8pt;font-weight:800;letter-spacing:.16em}.meta{display:grid;grid-template-columns:1fr auto;gap:4mm;align-items:end;margin-bottom:5mm}.meta .label{font-size:6.5pt;font-weight:700;letter-spacing:.08em;color:#666}.person{font-size:14pt;font-weight:800;margin-top:1mm}.rightmeta{text-align:right;font-size:7.5pt;line-height:1.7}.rightmeta strong{font-size:9pt}.items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.3pt}.items th,.items td{border:.25mm solid #111;padding:2mm 1.5mm;vertical-align:middle}.items th{font-size:7pt;letter-spacing:.04em}.items th:nth-child(1){width:58%}.items th:nth-child(2){width:30%}.items th:nth-child(3){width:12%}.items td:nth-child(2),.items td:nth-child(3){text-align:center}.footer{position:absolute;left:7mm;right:7mm;bottom:6mm;border-top:.2mm solid #bbb;padding-top:2mm;font-size:6.5pt;color:#666;display:flex;justify-content:space-between;align-items:center}.footer-brand{display:flex;align-items:center;gap:2.5mm}.footer-logo{width:24mm;height:auto;display:block}
.letter-sheet{
  width:210mm;min-height:148mm;padding:8mm 20mm 30mm;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.letter-body{
  width:100%;min-height:36mm;padding:0.5mm 2mm 6mm;border:.25mm dotted #bbb;
  text-align:center;white-space:pre-line;overflow-wrap:anywhere;
  font-family:Calibri,"Carlito",Arial,sans-serif;font-size:15pt;line-height:1.35;color:#111;
}
.letter-brand{margin-top:4.5mm}
.letter-logo{display:block;width:40mm;height:auto}
.empty{max-width:760px;margin:50px auto;background:#fff;padding:24px;border-radius:14px;text-align:center}@media(max-width:700px){.screenbar{padding:10px}.screenbar b{width:100%;margin:0}.screenbar button{flex:1}.preview{padding:10px;overflow:auto}.sheet{transform-origin:top left}.order-sheet{width:min(148mm,100%);min-height:auto}.letter-sheet{width:210mm}}
@media print{body{background:#fff}.screenbar,.notice{display:none!important}.preview{padding:0}.sheet{margin:0;box-shadow:none}.order-sheet{width:138mm;min-height:198mm;padding:6mm}.footer{left:6mm;right:6mm;bottom:4mm}}

.order-sheet{width:138mm;min-height:198mm;padding:6mm;display:flex;flex-direction:column}

<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const requested=params.get('type')||'order';const ids=(params.get('ids')||'').split(',').map(Number).filter(Boolean);let orders=[],templates=[],sets=[],mode=requested==='letter'?'letter':'order';
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function api(url){const r=await fetch(url,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Oturum gerekli')}if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
function dateTR(v){if(!v)return'—';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:'—'}
function displayNo(o){const s=String(o.order_no||'');return /^EXCEL-/i.test(s)?s.replace(/^EXCEL-/i,''):s}
function firstName(name){return String(name||'').trim().split(/\s+/)[0]||''}
function personalize(text,o){const first=firstName(o.recipient_name),full=o.recipient_name||'';return String(text||'').replace(/\{\{\s*AD_SOYAD\s*\}\}|\{\s*AD_SOYAD\s*\}|\[\s*AD_SOYAD\s*\]/gi,full).replace(/\{\{\s*(AD|İSİM|ISIM)\s*\}\}|\{\s*(AD|İSİM|ISIM)\s*\}|\[\s*(AD|İSİM|ISIM)\s*\]/gi,first)}
function expandedItems(o){const sm=new Map(sets.map(s=>[String(s.set_item_no),s]));const out=[];for(const it of (o.items||[])){const set=Array.isArray(it.set_components)?{items:it.set_components}:sm.get(String(it.item_code));if(set&&Array.isArray(set.items)&&set.items.length){for(const c of set.items)out.push({item_code:c.item_code,item_name:c.item_name||c.item_code,qty:Number(c.qty||1)*Number(it.qty||1)})}else out.push({item_code:it.item_code,item_name:it.item_name||it.item_code,qty:it.qty})}return out}
function orderHtml(o){return `<section class="sheet order-sheet"><div class="brand-name order-brand">OCEAN HOME TEXTILE</div><div class="company">OKYANUS EV DEKORASYON TEKS. SAN. VE TİC. A.Ş.<br>ALAPLI OSB 2 NO'LU OSB SK. NO:22<br>67852 ALAPLI / ZONGULDAK / TÜRKİYE<br>V.NU: 6400626031</div><div class="delivery">TESLİMAT</div><div class="meta"><div><div class="label">ALICI / INFLUENCER</div><div class="person">${esc(o.recipient_name||'—')}</div></div><div class="rightmeta"><div><span class="label">TARİH</span> ${dateTR(o.order_date)}</div><div><span class="label">NO</span> <strong>${esc(displayNo(o)||'—')}</strong></div></div></div><table class="items"><thead><tr><th>KALEM TANIMI</th><th>KALEM NUMARASI</th><th>ADET</th></tr></thead><tbody></tbody></table><div class="footer"><span class="page-count"></span><span class="footer-brand"><b class="brand-name">OCEAN HOME TEXTILE</b><span>Influencer Operasyon</span></span><span>${esc(o.city||'')}${o.district?' / '+esc(o.district):''}</span></div></section>`}
function appendOrderPages(order, preview){
  const pages=[];
  function newPage(){
    preview.insertAdjacentHTML('beforeend',orderHtml(order));
    const sheet=preview.lastElementChild;
    sheet.classList.add('measuring');
    pages.push(sheet);
    return sheet;
  }
  let sheet=newPage();
  const items=expandedItems(order);
  for(const item of items){
    let body=sheet.querySelector('tbody');
    if(body.rows.length>=7){
      sheet=newPage();
      body=sheet.querySelector('tbody');
    }
    const row=body.insertRow();
    for(const value of [item.item_name,item.item_code,item.qty])row.insertCell().textContent=value;
    const footer=sheet.querySelector('.footer');
    const bottom=footer.getBoundingClientRect().bottom;
    const limit=sheet.getBoundingClientRect().bottom-parseFloat(getComputedStyle(sheet).paddingBottom);
    if(body.rows.length>1 && bottom>0 && bottom>limit+0.5){
      sheet=newPage();
      sheet.querySelector('tbody').append(row);
    }
  }
  if(!items.length)sheet.querySelector('tbody').innerHTML='<tr><td colspan="3">Ürün bulunamadı</td></tr>';
  pages.forEach((page,index)=>{
    page.classList.remove('measuring');
    page.querySelector('.page-count').textContent=(index+1)+' / '+pages.length;
  });
}

function setMode(next){mode=next;$('pageStyle').textContent=next==='letter'?'@page{size:A5 landscape;margin:0}':'@page{size:A5 portrait;margin:5mm}';render()}
function fitLetter(sheet){
  const body=sheet.querySelector('.letter-body');
  const limit=148*96/25.4;
  if(sheet.getBoundingClientRect().height>limit+1)sheet.style.paddingBottom='8mm';
  for(let size=14.5;size>=10 && sheet.getBoundingClientRect().height>limit+1;size-=0.5){
    body.style.fontSize=size+'pt';
  }
}
function render(){let skipped=0;const preview=$('preview');preview.replaceChildren();for(const order of orders){if(mode==='order')appendOrderPages(order,preview);else{const html=letterHtml(order);if(html){preview.insertAdjacentHTML('beforeend',html);fitLetter(preview.lastElementChild)}else skipped++}}if(!preview.children.length)preview.innerHTML='<div class="empty">Yazdırılacak kayıt bulunamadı.</div>';$('barTitle').textContent=(mode==='letter'?'Yazı Kağıdı':'Sipariş Kağıdı')+' · '+orders.length+' kayıt';$('notice').style.display=skipped?'block':'none';$('notice').textContent=skipped?`${skipped} kayıtta yazı şablonu olmadığı için yazı çıktısına dahil edilmedi.`:'';$('orderBtn').style.display=requested==='letter'?'none':'';$('letterBtn').style.display=requested==='order'?'none':''}
async function doPrint(){
  try{
    await Promise.all([...document.querySelectorAll('#preview .letter-logo')].map(img=>img.decode()));
    window.print();
  }catch{
    $('notice').textContent='Yazı logosu yüklenemedi. Önizlemeyi yenileyip tekrar deneyin.';
    $('notice').style.display='block';
  }
}
async function init(){if(!ids.length){$('preview').innerHTML='<div class="empty">Sipariş seçilmemiş.</div>';return}try{[templates,sets]=await Promise.all([api('/api/templates'),api('/api/sets')]);orders=await Promise.all(ids.map(id=>api('/api/orders/'+id+'/detail')));if(requested==='both'){$('orderBtn').style.display='';$('letterBtn').style.display='';mode='order'}render()}catch(e){$('preview').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
init();
</script>
