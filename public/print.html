<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocean Influencer - Yazdır</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#111;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.screenbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#12253a;color:#fff;box-shadow:0 2px 12px #0002}.screenbar b{margin-right:auto}.screenbar button{font:inherit;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#fff;color:#12253a}.screenbar button.primary{background:#2d79b8;color:#fff}.notice{max-width:920px;margin:16px auto 0;padding:12px 16px;border-radius:10px;background:#fff4cc;color:#6b5700;display:none}.preview{padding:18px}.sheet{background:#fff;margin:0 auto 18px;box-shadow:0 7px 28px #17203324;position:relative;overflow:hidden;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.order-sheet{width:148mm;min-height:210mm;padding:8mm 7mm}.brand{font-weight:900;letter-spacing:.11em;font-size:19pt;line-height:1}.brand small{display:block;font-size:7pt;letter-spacing:.26em;margin-top:2mm}.company{font-size:6.8pt;line-height:1.35;margin-top:5mm;color:#343a40}.delivery{margin:7mm 0 3mm;padding:2.2mm 0;border-top:.35mm solid #111;border-bottom:.35mm solid #111;font-size:8pt;font-weight:800;letter-spacing:.16em}.meta{display:grid;grid-template-columns:1fr auto;gap:4mm;align-items:end;margin-bottom:5mm}.meta .label{font-size:6.5pt;font-weight:700;letter-spacing:.08em;color:#666}.person{font-size:14pt;font-weight:800;margin-top:1mm}.rightmeta{text-align:right;font-size:7.5pt;line-height:1.7}.rightmeta strong{font-size:9pt}.items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8.3pt}.items th,.items td{border:.25mm solid #111;padding:2mm 1.5mm;vertical-align:middle}.items th{font-size:7pt;letter-spacing:.04em}.items th:nth-child(1){width:58%}.items th:nth-child(2){width:30%}.items th:nth-child(3){width:12%}.items td:nth-child(2),.items td:nth-child(3){text-align:center}.footer{position:absolute;left:7mm;right:7mm;bottom:6mm;border-top:.2mm solid #bbb;padding-top:2mm;font-size:6.5pt;color:#666;display:flex;justify-content:space-between}
.letter-sheet{width:210mm;min-height:148mm;padding:18mm 22mm 13mm;display:flex;flex-direction:column;justify-content:flex-start}.letter-body{white-space:pre-wrap;font-family:Georgia,'Times New Roman',serif;font-size:15.5pt;line-height:1.48;max-width:165mm;margin-top:3mm}.letter-brand{margin-top:auto;padding-top:8mm;font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:.2em;font-size:9.5pt}.letter-no{position:absolute;right:9mm;bottom:7mm;font-family:Arial,Helvetica,sans-serif;font-size:6pt;color:#aaa}.empty{max-width:760px;margin:50px auto;background:#fff;padding:24px;border-radius:14px;text-align:center}@media(max-width:700px){.screenbar{padding:10px}.screenbar b{width:100%;margin:0}.screenbar button{flex:1}.preview{padding:10px;overflow:auto}.sheet{transform-origin:top left}.order-sheet{width:min(148mm,100%);min-height:auto}.letter-sheet{width:210mm}}
@media print{body{background:#fff}.screenbar,.notice{display:none!important}.preview{padding:0}.sheet{margin:0;box-shadow:none}.order-sheet{width:138mm;min-height:198mm;padding:6mm}.letter-sheet{width:198mm;min-height:136mm;padding:14mm 18mm 10mm}.footer{left:6mm;right:6mm;bottom:4mm}}
</style>
<style id="pageStyle">@page{size:A5 portrait;margin:5mm}</style>
</head>
<body>
<div class="screenbar"><b id="barTitle">Yazdırma Önizleme</b><button onclick="history.back()">← Geri</button><button id="orderBtn" class="primary" onclick="setMode('order');doPrint()">Sipariş Kağıdını Yazdır</button><button id="letterBtn" class="primary" onclick="setMode('letter');doPrint()">Yazı Kağıdını Yazdır</button></div>
<div id="notice" class="notice"></div>
<div id="preview" class="preview"></div>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const requested=params.get('type')||'order';const ids=(params.get('ids')||'').split(',').map(Number).filter(Boolean);let orders=[],templates=[],sets=[],mode=requested==='letter'?'letter':'order';
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
async function api(url){const r=await fetch(url,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='/';throw Error('Oturum gerekli')}if(!r.ok)throw Error(d.error||'İşlem başarısız');return d}
function dateTR(v){if(!v)return'—';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:'—'}
function displayNo(o){const s=String(o.order_no||'');return /^EXCEL-/i.test(s)?s.replace(/^EXCEL-/i,''):s}
function firstName(name){return String(name||'').trim().split(/\s+/)[0]||''}
function personalize(text,o){const first=firstName(o.recipient_name),full=o.recipient_name||'';return String(text||'').replace(/\{\{\s*AD_SOYAD\s*\}\}|\{\s*AD_SOYAD\s*\}|\[\s*AD_SOYAD\s*\]/gi,full).replace(/\{\{\s*(AD|İSİM|ISIM)\s*\}\}|\{\s*(AD|İSİM|ISIM)\s*\}|\[\s*(AD|İSİM|ISIM)\s*\]/gi,first)}
function expandedItems(o){const sm=new Map(sets.map(s=>[String(s.set_item_no),s]));const out=[];for(const it of (o.items||[])){const set=sm.get(String(it.item_code));if(set&&Array.isArray(set.items)&&set.items.length){for(const c of set.items)out.push({item_code:c.item_code,item_name:c.item_name||c.item_code,qty:Number(c.qty||1)*Number(it.qty||1)})}else out.push({item_code:it.item_code,item_name:it.item_name||it.item_code,qty:it.qty})}return out}
function orderHtml(o){const rows=expandedItems(o);return `<section class="sheet order-sheet"><div class="brand">OCEAN<small>HOME TEXTILE</small></div><div class="company">OKYANUS EV DEKORASYON TEKS. SAN. VE TİC. A.Ş.<br>ALAPLI OSB 2 NO'LU OSB SK. NO:22<br>67852 ALAPLI / ZONGULDAK / TÜRKİYE<br>V.NU: 6400626031</div><div class="delivery">TESLİMAT</div><div class="meta"><div><div class="label">ALICI / INFLUENCER</div><div class="person">${esc(o.recipient_name||'—')}</div></div><div class="rightmeta"><div><span class="label">TARİH</span> ${dateTR(o.order_date)}</div><div><span class="label">NO</span> <strong>${esc(displayNo(o)||'—')}</strong></div></div></div><table class="items"><thead><tr><th>KALEM TANIMI</th><th>KALEM NUMARASI</th><th>ADET</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${esc(x.item_name)}</td><td>${esc(x.item_code)}</td><td>${esc(x.qty)}</td></tr>`).join(''):'<tr><td colspan="3">Ürün bulunamadı</td></tr>'}</tbody></table><div class="footer"><span>Ocean Home Textile · Influencer Operasyon</span><span>${esc(o.city||'')}${o.district?' / '+esc(o.district):''}</span></div></section>`}
function letterHtml(o){const t=templates.find(x=>String(x.template_no)===String(o.letter_template_no));if(!o.letter_template_no||o.letter_template_no==='-'||!t)return'';const body=personalize(t.body||'',o);return `<section class="sheet letter-sheet"><div class="letter-body">${esc(body)}</div><div class="letter-brand">OCEAN HOME TEXTILE</div><div class="letter-no">Yazı No: ${esc(o.letter_template_no)}</div></section>`}
function setMode(next){mode=next;$('pageStyle').textContent=next==='letter'?'@page{size:A5 landscape;margin:5mm}':'@page{size:A5 portrait;margin:5mm}';render()}
function render(){let skipped=0;const html=orders.map(o=>{if(mode==='letter'){const h=letterHtml(o);if(!h)skipped++;return h}return orderHtml(o)}).join('');$('preview').innerHTML=html||'<div class="empty">Yazdırılacak kayıt bulunamadı.</div>';$('barTitle').textContent=(mode==='letter'?'Yazı Kağıdı':'Sipariş Kağıdı')+' · '+orders.length+' kayıt';$('notice').style.display=skipped?'block':'none';$('notice').textContent=skipped?`${skipped} kayıtta yazı şablonu olmadığı için yazı çıktısına dahil edilmedi.`:'';$('orderBtn').style.display=requested==='letter'?'none':'';$('letterBtn').style.display=requested==='order'?'none':''}
function doPrint(){setTimeout(()=>window.print(),80)}
async function init(){if(!ids.length){$('preview').innerHTML='<div class="empty">Sipariş seçilmemiş.</div>';return}try{[templates,sets]=await Promise.all([api('/api/templates'),api('/api/sets')]);orders=await Promise.all(ids.map(id=>api('/api/orders/'+id+'/detail')));if(requested==='both'){$('orderBtn').style.display='';$('letterBtn').style.display='';mode='order'}render()}catch(e){$('preview').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
init();
</script>
</body></html>
