<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>DHL test etiketi</title>
<style>
@page{size:auto;margin:0}
*{box-sizing:border-box}html,body,main,section{margin:0;padding:0}
body{font:15px system-ui;color:#173247}header{padding:16px}
.label{width:100%;height:100vh;padding:2.5vmin}
.label canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
@media print{
  header{display:none}
  .label{height:calc(100vh - 1px);break-inside:avoid;break-after:page}
  .label:last-child{break-after:auto}
  body:not(.ready) main{display:none}
}
</style></head><body><header><p id="status" role="status">Etiket hazırlanıyor…</p><p id="error" role="alert"></p><button id="print" disabled>Etiketi yazdır</button></header><main id="labels"></main><script src="/dhl-label.js?v=8"></script></body></html>
